<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservar hora — Simetría</title><link rel="stylesheet" href="agenda.css"></head><body onload="iniciarReserva()"><header class="top"><div class="brand">SIMETRÍA · RESERVAR</div><div class="navlinks"><a href="index.html">Inicio agenda</a><a href="doctor.html">Acceso profesionales</a><a href="../index.html">Sitio web</a></div></header><main class="shell"><div class="card"><span class="gold">AGENDA ONLINE · DEMO</span><h1>Reserva tu hora</h1><p class="small">Elige al profesional. La hora quedará ocupada solamente en la agenda de ese doctor y aparecerá en su central.</p><form id="reserva"><label>Especialidad *</label><select id="especialidad" required><option value="">Seleccionar…</option></select><label>Profesional *</label><select id="doctor" required><option value="">Seleccionar doctor…</option><option value="martinez">Dr. Martínez</option><option value="perez">Dr. Pérez</option><option value="pepito">Dr. Pepito</option></select><label>Fecha *</label><input id="fecha" type="date" required><label>Horas disponibles</label><div class="slots" id="horas"><p class="small">Primero selecciona un doctor y una fecha.</p></div><label>Nombre *</label><input id="nombre" required placeholder="Ej: Vicente Moreno"><label>Teléfono *</label><input id="telefono" required placeholder="+56 9..."><label>Correo</label><input id="email" type="email" placeholder="correo@ejemplo.cl"><br><br><button class="btn goldbtn" type="submit">Registrar hora</button></form><div id="resultado"></div></div></main><script src="agenda.js?v=4"></script></body></html>
