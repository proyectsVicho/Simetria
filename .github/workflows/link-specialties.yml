name: Fix specialty links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-specialties.yml'

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix links for GitHub Pages project site
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # GitHub Pages publishes this repo under /Simetria/.
          # Root-absolute links such as /implantologia/ point outside the project,
          # so use links relative to index.html instead.
          replacements = {
              'href="/especialidades/"': 'href="especialidades/"',
              'href="/odontologia-general/"': 'href="odontologia-general/"',
              'href="/estetica-dental/"': 'href="estetica-dental/"',
              'href="/ortodoncia-y-ortopedia/"': 'href="ortodoncia-y-ortopedia/"',
              'href="/implantologia/"': 'href="implantologia/"',
              'href="/cirugia-oral/"': 'href="cirugia-oral/"',
              'href="/rehabilitacion-oral/"': 'href="rehabilitacion-oral/"',
              'href="/endodoncia/"': 'href="endodoncia/"',
              'href="/atm-y-bruxismo/"': 'href="atm-y-bruxismo/"',
              'href="/estetica-facial/"': 'href="estetica-facial/"',
              'href="/bienestar-integral/"': 'href="bienestar-integral/"',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          p.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix specialty routes on GitHub Pages"
          git push origin main
